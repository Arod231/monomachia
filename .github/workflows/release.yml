# When you publish a release on GitHub, this builds the game and attaches
# Monomachia.html to the release so anyone can download and play it.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html Monomachia.html
      - run: gh release upload "$TAG" Monomachia.html --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
